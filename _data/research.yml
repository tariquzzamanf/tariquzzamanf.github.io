  - id: text-augmentation
    title: "Text Augmentation"
    papers:
      - id: bangla-text-data-augmentation-framework
        nodename: "BDA"
        ishighlight: 0
        year: 2024
        title: "BDA: Bangla Text Data Augmentation Framework"
        image: "/images/bda-bangla-text-data-augmentation-framework.png"
        image_alt: "BDA workflow for generating and filtering synthetic Bangla text samples"
        venue: "arXiv"
        authors:
          - name: "Md. Tariquzzaman"
            highlight: true
          - name: "Audwit Nafi Anam"
          - name: "Naimul Haque"
          - name: "Mohsinul Kabir"
          - name: "Hasan Mahmud"
          - name: "Md Kamrul Hasan"
        links:
          - label: "Paper"
            url: "https://arxiv.org/abs/2412.08753"
        tldr: "BDA combines multiple augmentation methods (synonym replacement, random swap, back-translation, paraphrasing) with a semantic filtering step to synthetically expand Bangla training data — achieving near full-data performance with significantly less data."
        keywords:
          - "Text Augmentation"
          - "Bangla NLP"

  - id: harmful-content
    title: "Harmful Content"
    papers:
      - id: bangla-fasttext-violence-detection
        nodename: "BIFT"
        ishighlight: 1
        year: 2023
        title: "A Novel Informal Bangla FastText Embedding for Violence Inciting Text Detection"
        image: "/images/bangla-fasttext-violence-detection.png"
        image_alt: "Training workflow for the informal Bangla FastText embedding and violence-inciting text classifier"
        highlight_image_width: 70
        venue: "BLP@EMNLP'23 | Best Shared Task Paper Award"
        venue_url: "https://blp-workshop.github.io/2023/"
        authors:
          - name: "Md. Tariquzzaman"
            highlight: true
          - name: "Md. Wasif Kader"
          - name: "Audwit Nafi Anam"
          - name: "Naimul Haque"
          - name: "Mohsinul Kabir"
          - name: "Hasan Mahmud"
          - name: "Md Kamrul Hasan"
        links:
          - label: "Paper"
            url: "https://aclanthology.org/2023.banglalp-1.26/"
          - label: "Code"
            url: "https://github.com/tariquzzamanf/VITD"
          - label: "Dataset"
            url: "https://github.com/blp-workshop/blp_task1"
          - label: "Video"
            url: "https://aclanthology.org/2023.banglalp-1.26.mp4"
        tldr: "Trained a custom FastText embedding on informal Bangla social media texts for violence detection. When paired with a BiLSTM, it matched near-transformer-level accuracy while being significantly faster and cheaper than BanglaBERT."
        keywords:
          - "Word embeddings"
          - "Text Classification"
          - "Bangla NLP"
